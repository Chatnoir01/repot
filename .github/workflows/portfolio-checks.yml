name: Portfolio checks
on:
  push:
    branches: ['codex/portfolio-developpeur-v1-20261119']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node scripts/verify.mjs
