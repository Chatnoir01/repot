name: V4 Academy quality
on:
  push:
    branches: ['codex/devlab-v4-practice-workspace-20261120']
  pull_request:
permissions:
  contents: read
jobs:
  test-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/academy-v4.test.mjs
      - run: node --test tests/*.test.mjs
      - run: node scripts/verify.mjs
