name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node scripts/verify.mjs
      - name: Fetch Academy C compiler binaries
        run: |
          curl -fLsS --retry 3 https://divsmith.github.io/c2wasm/compiler.wasm -o academy/compiler.wasm
          curl -fLsS --retry 3 https://divsmith.github.io/c2wasm/assembler.wasm -o academy/assembler.wasm
          printf '%s\n' '5852995d1cb03db58e473b4c16a1d7dd50748feca43b9d335ddcb0e166dbfc49  academy/compiler.wasm' '6fa4c8799d55f7af228050ba56a4a7cd9a5280f97f97622d17c709c9a231a1ef  academy/assembler.wasm' | sha256sum -c -
      - name: Verify actual C programs compile and execute
        run: node scripts/verify-actual-c-compiler.mjs
      - name: Download pinned C compiler for Academy V4
        run: |
          curl -fLsS --retry 3 https://divsmith.github.io/c2wasm/compiler.wasm -o academy-v4/compiler.wasm
          curl -fLsS --retry 3 https://divsmith.github.io/c2wasm/assembler.wasm -o academy-v4/assembler.wasm
          printf '%s\n' '5852995d1cb03db58e473b4c16a1d7dd50748feca43b9d335ddcb0e166dbfc49  academy-v4/compiler.wasm' '6fa4c8799d55f7af228050ba56a4a7cd9a5280f97f97622d17c709c9a231a1ef  academy-v4/assembler.wasm' | sha256sum -c -
      - name: Verify Academy V4 C compilation
        run: node scripts/verify-v4-c-compiler.mjs
      - name: Verify all 18 Fondations C lessons by actual compilation
        run: node scripts/verify-fondations-c.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
