name: Campus checks
on:
  push:
    branches: ['codex/devlab-campus-foundation-20261120']
  pull_request:
permissions:
  contents: read
jobs:
  campus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Campus and existing automated tests
        run: node --test tests/*.test.mjs
      - run: node scripts/verify.mjs
