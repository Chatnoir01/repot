name: secure-core-ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: python3 scripts/secret_scan.py
      - run: python3 scripts/source_policy.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: mkdir -p evidence && cargo metadata --format-version 1 > /tmp/cargo-metadata.json
      - run: python3 scripts/sbom.py /tmp/cargo-metadata.json evidence/sbom.spdx.json
      - run: SECURE_CORE_TEST_RESULT=PASS python3 scripts/receipt.py evidence/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: secure-core-evidence
          path: evidence/
