[package]
name = "secure-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha3 = "0.10"
hex = "0.4"
chacha20poly1305 = "0.10"
hmac = "0.12"

[dev-dependencies]
proptest = "1"
